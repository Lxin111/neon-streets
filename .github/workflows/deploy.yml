name: Deploy NEON STREETS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check official scanned rigged character download sources
        run: |
          curl --fail --location --retry 2 --silent --show-error https://renderpeople.com/free-3d-people/ -o /tmp/renderpeople.html
          echo "Official Renderpeople sample download candidates:"
          grep -Eo 'https?[^" ]+(rigged|animated)[^" ]+\\.(zip|glb|fbx)' /tmp/renderpeople.html | head -20 || true
          grep -Eo 'rp_[A-Za-z0-9_]+_(FBX|GLB)\\.zip' /tmp/renderpeople.html | sort -u | head -20 || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download CC0 rigged human character
        run: |
          mkdir -p public/models
          curl --fail --location --retry 4 --retry-delay 2 "https://files.innerscene.com/library/locomotion-collection-harper-3d-person-animated-797e1e2a/9f8c001a7561fb4ad2e7/locomotion-collection-harper-3d-person-animated.glb" --output public/models/harper-locomotion.glb
          test "$(stat -c%s public/models/harper-locomotion.glb)" -gt 1000000
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4