name: Deploy NEON STREETS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check official scanned rigged character download sources
        run: |
          curl --fail --location --retry 2 --silent --show-error https://renderpeople.com/free-3d-people/ -o /tmp/renderpeople.html
          echo "Official Renderpeople sample download candidates:"
          grep -Eo 'https?[^" ]+(rigged|animated)[^" ]+\.(zip|glb|fbx)' /tmp/renderpeople.html | head -20 || true
          grep -Eo 'rp_[A-Za-z0-9_]+_(FBX|GLB)\.zip' /tmp/renderpeople.html | sort -u | head -20 || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect official photogrammetry animated character pack
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "https://renderpeople.com/sample/free/renderpeople_free_animated_people_FBX.zip" --output /tmp/renderpeople-animated.zip
          echo "Renderpeople animated scan archive contents:"
          unzip -l /tmp/renderpeople-animated.zip | head -80
          unzip -p /tmp/renderpeople-animated.zip rp_nathan_animated_003_walking_FBX.zip > /tmp/renderpeople-nathan.zip
          echo "Nathan scanned model package contents:"
          unzip -l /tmp/renderpeople-nathan.zip | head -80
      - name: Convert scanned Renderpeople character to GLB
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          mkdir -p /tmp/renderpeople-nathan public/models
          python3 - <<'PY'
          import os, zipfile
          source = "/tmp/renderpeople-nathan.zip"
          target = "/tmp/renderpeople-nathan"
          os.makedirs(target, exist_ok=True)
          with zipfile.ZipFile(source) as archive:
              for item in archive.infolist():
                  name = item.filename.replace("\\\\", "/")
                  base = os.path.basename(name)
                  if not base or not base.lower().endswith((".fbx", ".jpg", ".png")):
                      continue
                  with archive.open(item) as src, open(os.path.join(target, base), "wb") as dst:
                      dst.write(src.read())
          PY
          blender --background --python scripts/convert_renderpeople.py -- /tmp/renderpeople-nathan/rp_nathan_animated_003_walking.fbx public/models/nathan-photogrammetry.glb
          test "$(stat -c%s public/models/nathan-photogrammetry.glb)" -gt 10000000
      - name: Download CC0 rigged human character
        run: |
          mkdir -p public/models
          curl --fail --location --retry 4 --retry-delay 2 "https://files.innerscene.com/library/locomotion-collection-harper-3d-person-animated-797e1e2a/9f8c001a7561fb4ad2e7/locomotion-collection-harper-3d-person-animated.glb" --output public/models/harper-locomotion.glb
          test "$(stat -c%s public/models/harper-locomotion.glb)" -gt 1000000
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4